<link rel="stylesheet" href="/css/modules/card.css">

<p class="containertitle">送養審核</p>

<!--內容-->
<div class="memcenter-container">

    <!--卡片-->
    <div class="card ">
        <div class="row">

            <!--照片-->
            <div class="col-md-4">
                <img class="petimg img-fluid rounded-start" src="/assets/img/logo/Logo.png">
            </div>

            <!--內容-->
            <div class="col-md-6">

                <p class="card-text">姓名 :</p>
                <p class="card-text">性別 :</p>
                <p class="card-text">品種 :</p>


                <button id="card_btn" class="btn"  data-bs-toggle="collapse" data-bs-target="#adoptionReviewAccordion">
                    <i id="chevron-down" class="bi bi-chevron-down chevron-down"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 審核內容 -->
    <div id="adoptionReviewAccordion"  class="collapse">
        <div class="card accordioncontainer">

            <div class="accordionimg">
                <img src="/assets/img/logo/Logo.png">
                <p>亂數亂數亂數亂數</p>
            </div>

            <div class="accordionbtngroup">
                <button class="btn accordionbtn">領養人詳細資料</button>
                <div class="link"></div>
                <button class="btn accordionbtn">開啟聊天室</button>
                <div class="link"></div>
                <button class="btn accordionbtn">同意</button>
            </div>
        </div>

        

    </div>
</div>
