<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ReHome 後台管理系統 - 問卷設定">
    <title>問卷設定 | ReHome 後台管理系統</title>
    <script src="../js/lib/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/survey.css">
</head>
<body>
    <div class="header"></div>
    <div class="main-container">
        <div class="sidebar"></div>
        <main class="content">
            <div class="survey-container">
                <h1 class="page-title">問卷設定</h1>
                
                <!-- 領養問卷設定 -->
                <section class="survey-section">
                    <h2 class="section-title">領養問卷設定</h2>
                    <div class="survey-item">
                        <button class="edit-btn">Edit</button>
                        <span class="update-info">最近更新：2025/12/04 20:15:30</span>
                    </div>
                </section>
                
                <!-- 送養問卷設定 -->
                <section class="survey-section">
                    <h2 class="section-title">送養問卷設定</h2>
                    <div class="survey-item">
                        <button class="edit-btn">Edit</button>
                        <span class="update-info">最近更新：2025/12/04 20:15:30</span>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="../js/component-loader.js"></script>
    <script src="../js/survey.js"></script>
</body>

<!-- Modal 彈出視窗 -->
<div id="surveyModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">領養問卷編輯</h2>
            <button class="close-btn">&times;</button>
        </div>
        
        <div class="modal-body">
            <!-- 問卷題目列表 -->
            <div id="questionList" class="question-list">
                <!-- 問卷題目將由 JavaScript 動態載入 -->
            </div>
            
            <!-- 新增問題按鈕 -->
            <button class="add-question-btn">+ 新增題目</button>
        </div>
        
        <div class="modal-footer">
            <button class="btn-cancel">取消</button>
            <button class="btn-save">儲存</button>
        </div>
    </div>
</div>

</html>
